<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1a29"/>
      <stop offset="50%" stop-color="#13101c"/>
      <stop offset="100%" stop-color="#0b0914"/>
    </linearGradient>

    <!-- Accent Diamond Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3c0"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Shadow -->
    <filter id="appShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#a78bfa" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Base macOS App Icon Container -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#appShadow)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3"/>

  <!-- Subtle Inner Glass Ring -->
  <rect x="44" y="44" width="424" height="424" rx="92" ry="92" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>

  <!-- Material 3 Scallop Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#a78bfa" opacity="0.18" filter="url(#glow)"/>

  <!-- M3 Scalloped Center Badge -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- 8-Pointed Smooth Scallop Flower -->
    <path d="M 0,-120 C 35,-120 45,-90 75,-90 C 105,-90 120,-60 120,-25 C 120,10 100,35 100,65 C 100,95 70,120 35,120 C 0,120 -10,100 -40,100 C -70,100 -95,70 -95,35 C -95,0 -120,-10 -120,-45 C -120,-80 -90,-105 -55,-105 C -20,-105 0,-120 0,-120 Z"
          fill="rgba(255, 255, 255, 0.04)"
          stroke="url(#diamondGrad)"
          stroke-width="4"
          stroke-linejoin="round"/>
  </g>

  <!-- Central Diamond Symbol (💠 Material Sparkle Icon) -->
  <g transform="translate(256, 256) scale(1.2)" filter="url(#glow)">
    <!-- Outer Rotated Square -->
    <rect x="-64" y="-64" width="128" height="128" rx="28" fill="url(#diamondGrad)" transform="rotate(45)"/>
    <!-- Inner Cross Cutouts -->
    <circle cx="0" cy="0" r="28" fill="#13101c"/>
    <rect x="-42" y="-4" width="84" height="8" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="-4" y="-42" width="8" height="84" rx="4" fill="#ffffff" opacity="0.95"/>
    <!-- Center Sparkling Dot -->
    <circle cx="0" cy="0" r="10" fill="#7dd3c0"/>
  </g>
</svg>

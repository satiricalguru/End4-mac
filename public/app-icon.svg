<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="diamondGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feFlood flood-color="#38bdf8" flood-opacity="0.45" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Top & Side Facet Gradients -->
    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="bottomFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <g filter="url(#diamondGlow)" transform="translate(0, 0)">
    <!-- 💠 Main Outer Diamond (Rotated Square with Curvature & Facets) -->
    <!-- Outer Diamond Silhouette -->
    <path d="M 256 36 L 476 256 L 256 476 L 36 256 Z"
          fill="#0369a1"
          stroke="#7dd3fc"
          stroke-width="8"
          stroke-linejoin="round"/>

    <!-- Top Triangle Facet -->
    <path d="M 256 36 L 476 256 L 256 256 Z" fill="url(#topFacet)" opacity="0.9"/>

    <!-- Left Triangle Facet -->
    <path d="M 256 36 L 36 256 L 256 256 Z" fill="url(#leftFacet)"/>

    <!-- Bottom Left Triangle Facet -->
    <path d="M 36 256 L 256 476 L 256 256 Z" fill="url(#bottomFacet)"/>

    <!-- Bottom Right Triangle Facet -->
    <path d="M 476 256 L 256 476 L 256 256 Z" fill="url(#rightFacet)"/>

    <!-- Inner Stepped Diamond (The iconic 💠 layered inner diamond) -->
    <path d="M 256 120 L 392 256 L 256 392 L 120 256 Z"
          fill="url(#innerGlow)"
          stroke="#ffffff"
          stroke-width="6"
          stroke-linejoin="round"/>

    <!-- Inner Core Cutout (Center Hole of 💠) -->
    <circle cx="256" cy="256" r="48" fill="#0f172a" stroke="#ffffff" stroke-width="8"/>

    <!-- Sparkling Center Dot -->
    <circle cx="256" cy="256" r="22" fill="#38bdf8"/>
    <circle cx="256" cy="256" r="10" fill="#ffffff"/>

    <!-- Subtle Glint Highlights -->
    <polygon points="256,52 268,100 256,92 244,100" fill="#ffffff" opacity="0.8"/>
    <circle cx="150" cy="230" r="8" fill="#ffffff" opacity="0.7"/>
    <circle cx="362" cy="282" r="8" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
